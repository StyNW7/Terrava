; Terrava single-channel LoRa gateway (P2P mode)
;
; For pilots without LoRaWAN coverage: receives Terrava ear tag frames on one
; LoRa channel, forwards them over Wi-Fi to the Terrava backend, and relays
; downlink commands back to the tags. For production at scale use a LoRaWAN
; gateway + The Things Stack / ChirpStack instead (see iot/README.md).
;
; Reference hardware: LilyGO TTGO LoRa32 v2.1 (ESP32 + SX1276, 915/923 MHz variant)
;
;   pio run -t upload && pio device monitor

[env:lora32]
platform = espressif32@6.13.0
framework = arduino
board = ttgo-lora32-v21
monitor_speed = 115200
build_flags =
  -I ../../protocol
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  jgromes/RadioLib@^7.8.1
  bblanchon/ArduinoJson@^7.4.3
