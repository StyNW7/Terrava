; Terrava smart ear tag firmware
;
; Reference hardware: LilyGO T-Beam v1.1/v1.2 (ESP32 + SX1276 LoRa + NEO-6M/M8N GPS + AXP192 PMU)
; with I2C sensors MAX30102 (heart rate + SpO2), MLX90614 (IR temperature) and MPU6050 (accel + gyro).
;
;   pio run -e tbeam-lorawan            build (LoRaWAN, AS923-2 for Indonesia)
;   pio run -e tbeam-lorawan -t upload  flash over USB
;   pio device monitor                  serial log (115200)
;   pio run -e tbeam-p2p                LoRa point-to-point build for the Terrava gateway
;   pio test -e native                  protocol unit tests on the host (needs gcc)

[platformio]
default_envs = tbeam-lorawan

[env]
platform = espressif32@6.13.0
framework = arduino
board = ttgo-t-beam
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags =
  -I ../../protocol
  -D CORE_DEBUG_LEVEL=1
lib_deps =
  jgromes/RadioLib@^7.8.1
  mikalhart/TinyGPSPlus@^1.1.0
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
  adafruit/Adafruit MLX90614 Library@^2.1.7
  adafruit/Adafruit MPU6050@^2.2.9
  lewisxhe/XPowersLib@^0.3.3

[env:tbeam-lorawan]
build_flags =
  ${env.build_flags}
  -D TERRAVA_RADIO_LORAWAN=1

[env:tbeam-p2p]
build_flags =
  ${env.build_flags}
  -D TERRAVA_RADIO_P2P=1

; Host-side unit tests of the shared protocol header (Unity).
[env:native]
platform = native
framework =
lib_deps =
build_flags = -I ../../protocol
test_build_src = no
