<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7FAF8" />
    <meta name="application-name" content="Terrava" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Terrava" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      (function () {
        try {
          var pref = localStorage.getItem("terrava-theme");
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
    <title>Terrava | AI-Powered Smart Livestock Ecosystem</title>
    <meta
      name="description"
      content="Terrava membantu peternak memantau kesehatan ternak, mendeteksi risiko lebih awal, dan mengambil keputusan melalui IoT dan AI."
    />
    <link rel="canonical" href="https://terrava.example.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Terrava" />
    <meta property="og:title" content="Terrava | AI-Powered Smart Livestock Ecosystem" />
    <meta
      property="og:description"
      content="Smart Livestock Ecosystem berbasis AI dan IoT untuk kesehatan ternak yang lebih terjaga dan peternakan yang lebih produktif."
    />
    <meta property="og:image" content="/Images/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
